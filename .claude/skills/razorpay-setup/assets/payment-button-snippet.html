<!-- ============================================================
     Pre-order section with a Razorpay Payment Button.
     Paste into site/index.html AFTER the specs </section> and
     BEFORE the footer, then replace pl_REPLACE_ME with the real
     button ID from Razorpay Dashboard → Payment Button.
     Deliberately a static (non-pinned) section: the button is an
     injected iframe and must not sit under GSAP transforms.
     ============================================================ -->
<section class="specs" id="preorder" aria-label="Pre-order">
  <header class="specs__head reveal">
    <p class="eyebrow">Pre-order</p>
    <h2>Yours, before it exists.</h2>
  </header>
  <div class="reveal" style="max-width: 420px; margin: 0 auto; text-align: center;">
    <form>
      <script
        src="https://cdn.razorpay.com/static/widget/payment-button.js"
        data-payment_button_id="pl_REPLACE_ME"
        data-button_text="Pre-order PHONEX ULTRA"
        data-button_theme="rzp-dark-standard">
      </script>
    </form>
    <noscript>
      <!-- Payment Links work without JavaScript; create one in the
           dashboard and put its URL here -->
      <a class="cta-pill cta-pill--big" href="https://rzp.io/l/REPLACE_ME">Pre-order</a>
    </noscript>
    <p style="margin-top: 18px; font-size: 12.5px; color: var(--ink-dim);">
      Demo checkout · test mode · no real charges. The PHONEX ULTRA is not
      a real product.
    </p>
  </div>
</section>
